    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f83" x="323.28" y="537.717656" transform="rotate(-0 323.28 537.717656)">East</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f83" x="197.28" y="632.037656" transform="rotate(-0 197.28 632.037656)">South</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f83" x="197.28" y="537.717656" transform="rotate(-0 197.28 537.717656)">Center</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f83" x="521.28" y="400.917656" transform="rotate(-0 521.28 400.917656)">Graph sampling contract</text>
   </g>
   <g id="text_18">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(521.28 435.397969)">Connected tiles share one event, origin and lead.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(521.28 452.424617)">Expand context to cover the graph layers.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(521.28 469.451266)">Use observed inputs; score designated centers.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(521.28 486.477914)">Local communication does not cover the entire basin.</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #123147" x="972.72" y="400.917656" transform="rotate(-0 972.72 400.917656)">What the graph adds</text>
   </g>
   <g id="text_20">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(972.72 435.397969)">Halo: nearby pixel-level hydraulic context.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(972.72 452.424617)">Graph: learned tile-to-tile feature communication.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(972.72 469.451266)">Zero-initialized projection starts with no added context.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(972.72 486.477914)">HUC12 hierarchy remains a proposed extension.</text>
   </g>
   <g id="text_21">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243c4b" x="43.2" y="696.718125" transform="rotate(-0 43.2 696.718125)">Edges encode geometric contact. Learned messages are features, not conserved water fluxes.</text>
   </g>
   <g id="text_22">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #58707f" x="43.2" y="724.758281" transform="rotate(-0 43.2 724.758281)">Implemented local graph prototype; corrected-data forecasting benefit remains unproven.</text>
   </g>
  </g>
