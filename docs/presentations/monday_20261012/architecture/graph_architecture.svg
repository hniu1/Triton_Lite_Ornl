   <g id="text_1">
    <text style="font-weight: 700; font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #123147" x="39.6" y="45.715781" transform="rotate(-0 39.6 45.715781)">Tile graph communication inside the direct U-Net</text>
   </g>
   <g id="text_2">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #58707f" x="41.04" y="79.819062" transform="rotate(-0 41.04 79.819062)">V5-D prototype  |  One tile = one node; graph context conditions the raster forecast</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #123147" x="56.16" y="170.517656" transform="rotate(-0 56.16 170.517656)">1  Shared tile encoder</text>
   </g>
   <g id="text_4">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(56.16 204.997969)">Terrain + observed state/history</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(56.16 222.024617)">Forcing, times and requested lead</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(56.16 239.051266)">Optional hydraulic halo</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(56.16 256.077914)">Encode every context tile</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #123147" x="390.96" y="170.517656" transform="rotate(-0 390.96 170.517656)">2  Node features</text>
   </g>
   <g id="text_6">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(390.96 204.997969)">Pooled 20 × 20 spatial features</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(390.96 222.024617)">Four directional boundary summaries</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(390.96 239.051266)">Tile forcing/time/lead conditioning</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(390.96 256.077914)">Linear node projection</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f83" x="725.76" y="170.517656" transform="rotate(-0 725.76 170.517656)">3  Message passing</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(725.76 204.997969)">Learn messages on tile edges</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(725.76 222.024617)">Mean incoming messages</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(725.76 239.051266)">Residual node update</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(725.76 256.077914)">Repeat K spatial layers</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #123147" x="1042.56" y="170.517656" transform="rotate(-0 1042.56 170.517656)">4  U-Net bottleneck context</text>
   </g>
   <g id="text_10">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(1042.56 204.997969)">c′ = c + P(zᴷ − z⁰)</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(1042.56 222.024617)">Concatenate with pooled raster features</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(1042.56 239.051266)">Decoder + original skip features</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(1042.56 256.077914)">Central depth, extent, HU/HV forecast</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #123147" x="56.16" y="372.917344" transform="rotate(-0 56.16 372.917344)">Shared-boundary tile adjacency</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f83" x="197.28" y="443.397656" transform="rotate(-0 197.28 443.397656)">North</text>
   </g>
