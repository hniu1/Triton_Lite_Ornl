   <g id="text_1">
    <text style="font-weight: 700; font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #123147" x="39.6" y="45.715781" transform="rotate(-0 39.6 45.715781)">What happens in one message-passing layer?</text>
   </g>
   <g id="text_2">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #58707f" x="41.04" y="79.819062" transform="rotate(-0 41.04 79.819062)">Source tile j → destination tile i  |  The same learned functions are shared across edges and nodes</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f83" x="56.16" y="170.517656" transform="rotate(-0 56.16 170.517656)">1  Build each edge message</text>
   </g>
   <g id="text_4">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(56.16 204.997969)">m(j→i) = Mₖ([zⱼ, zᵢ, aⱼᵢ])</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(56.16 222.024617)">Use source and destination features.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(56.16 239.051266)">Edge attributes a are optional.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f83" x="393.84" y="170.517656" transform="rotate(-0 393.84 170.517656)">2  Aggregate at destination</text>
   </g>
   <g id="text_6">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(393.84 204.997969)">m̄ᵢ = mean of incoming messages</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(393.84 222.024617)">Average over the tile’s neighbors.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(393.84 239.051266)">Degree can vary between tiles.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f83" x="731.52" y="170.517656" transform="rotate(-0 731.52 170.517656)">3  Update the destination</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(731.52 204.997969)">zᵢ ← zᵢ + Uₖ([zᵢ, m̄ᵢ])</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(731.52 222.024617)">Residual update retains local features.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(731.52 239.051266)">No incoming edges:</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(731.52 256.077914)">node stays unchanged.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f83" x="1069.2" y="170.517656" transform="rotate(-0 1069.2 170.517656)">4  Repeat and condition</text>
   </g>
   <g id="text_10">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(1069.2 204.997969)">Repeat for K graph layers.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(1069.2 222.024617)">c′ᵢ = cᵢ + P(zᵢᴷ − zᵢ⁰)</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(1069.2 239.051266)">Use c′ᵢ in the U-Net bottleneck.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #123147" x="56.16" y="377.157656" transform="rotate(-0 56.16 377.157656)">Reading the symbols</text>
   </g>
   <g id="text_12">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(56.16 411.637969)">zᵢ: encoded features for tile i</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(56.16 428.664617)">Mₖ: learned message MLP</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(56.16 445.691266)">Uₖ: learned update MLP</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(56.16 462.717914)">P: learned linear projection</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(56.16 479.744563)">[ , ]: concatenation; k: graph layer</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #123147" x="524.16" y="377.157656" transform="rotate(-0 524.16 377.157656)">Two layers = two spatial hops</text>
   </g>
   <g id="text_14">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(524.16 411.637969)">Layer 1 uses adjacent-tile features.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(524.16 428.664617)">Layer 2 can carry features from two hops away.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(524.16 445.691266)">These are spatial exchanges, not forecast steps.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(524.16 462.717914)">All nodes still share the same origin and lead.</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #123147" x="992.16" y="377.157656" transform="rotate(-0 992.16 377.157656)">How we test its value</text>
   </g>
   <g id="text_16">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(992.16 411.637969)">Same U-Net and connected context batches:</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(992.16 428.664617)">• U-Net without graph messages</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(992.16 445.691266)">• Local capacity control with self edges</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(992.16 462.717914)">• Graph with actual adjacency edges</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c4b" transform="translate(992.16 479.744563)">Match data, losses and evaluation origins.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243c4b" x="43.2" y="696.718125" transform="rotate(-0 43.2 696.718125)">Messages have no water-volume interpretation; physical conservation requires a separate formulation.</text>
   </g>
   <g id="text_18">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #58707f" x="43.2" y="724.758281" transform="rotate(-0 43.2 724.758281)">Implemented local graph prototype; corrected-data forecasting benefit remains unproven.</text>
   </g>
  </g>
 </g>
