[Paths]
# Root where event folders live: {bin_root}/D001/output/flood2d/bin contains H*, QX*, QY*, etc.
bin_root       = C:/path/to/TRITON/outputs
netcdf_dir     = C:/data/depth/raw_netcdf

[Events]
start_event    = 1
end_event      = 40
skip_events    = D004

[Output]
output_type    = H              ; one of: H (depth), QX(U), QY(V)
data_name_tmpl = {event}_ACC_future.nc
var_name       = output_depth
fill_value     = -9999.0

[Grid]
cols           = 5474
rows           = 7976
# gt = (xmin, xres, xrot, ymax, yrot, yres)
xmin           = 676222.46162369
xres           = 9.50608224323499
xrot           = 0.0
ymax           = 3891564.837097742
yrot           = 0.0
yres           = -9.506082243234989

[Time]
# CF time reference string and origin used in your original script
ref_time       = hours since 2013-02-02 03:00:00 -5:00
origin_year    = 1966
origin_month   = 2
origin_day     = 2
origin_hour    = 3
origin_utc_offset_hours = -5

# Input sequence (e.g., hydro forcing at 3h)
in_steps       = 80
in_step_sec    = 10800

# Output sequence (model snapshots at 30 min)
out_steps      = 480
out_step_sec   = 1800

[BinaryReader]
threshold      = 0.0
pad            = 1
dtype          = float32        ; TRITON binary payload dtype
