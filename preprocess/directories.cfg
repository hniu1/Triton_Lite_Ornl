[Directories]
# 1) block-grid
DEMPath = C:/path/to/D001_dem.tif
LargeGridShapefilePath = C:/path/to/blocks_conasauga.shp
BlockIndexCSV = C:/path/to/block_index.csv
BlockWidth = 80
BlockHeight = 80

# 2) mom
NetCDFInputDir = C:/dir/with/netcdfs
MOMRasterOutputDir = C:/dir/for/mom_rasters
NetCDFVariable = output_depth

# 3) dissolve
MOM_Raster_Path = C:/dir/for/mom_rasters/Final_MOM_ACC_baseline.tif
OutputShapefilePath = C:/path/to/MOM_raster_dissolved.shp

# 4) block-ll-csv
ShapefileDir = C:/path/to/shapefiles                  ; optional if explicit paths given
DissolvedShapefilePath = C:/path/to/MOM_raster_dissolved.shp
BlocksShapefilePath = C:/path/to/blocks_conasauga.shp
shapefile_path = C:/path/to/watersheds.shp            ; must contain field 'Name'
output_csv_path = C:/path/to/block_ll_points.csv

# 5) extract (04_)
ExtractOutputDir = C:/dir/for/clipped_tiffs
ExtractShapefilePath = C:/path/to/clip_polygon.shp
ExtractEventNameTemplate = D{num:03d}_test.nc
ExtractOutputNameTemplate = ACC_D{num:03d}_clipped.tif
ExtractEventStart = 1
ExtractEventEnd = 40
